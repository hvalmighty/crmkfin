{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-box card">
  <div class="brand-top">
    <span class="mark"><svg class="i"><use href="#i-layers"/></svg></span>
    <h1>{{ g.cfg.company_name }}</h1>
    <p class="sub" style="margin:0">Sign in to your account</p>
  </div>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p><label for="username">Login ID</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required></p>
    <p><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit" style="width:100%;margin-top:6px">Sign in</button>
  </form>
</div>
{% endblock %}
